<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UOW Parking — Manage Bookings</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================================================
     MANAGE BOOKINGS PAGE  (manage-bookings.html)
     Shows: list of user bookings with Change / Delete actions,
            booking detail panel, change booking form
     ============================================================ -->

<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">

    <!-- Topbar -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-brand">UOW Smart Parking Management System</div>
        <div class="topbar-title">Manage Bookings</div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary btn-sm"
          onclick="location.href='booking.html'">+ New Booking</button>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="row">

        <!-- ── Left: My Bookings list ── -->
        <div class="col-2">
          <div class="card mb-0">
            <div class="card-title">My Bookings</div>
            <div id="bookings-list">
              <!-- Populated by manage-bookings.js -->
            </div>
          </div>
        </div>

        <!-- ── Right: Detail + Change form ── -->
        <div class="col">

          <!-- Booking Details -->
          <div class="card">
            <div class="card-title">Booking Details</div>
            <div class="detail-row">
              <span class="detail-key">Parking Area</span>
              <span class="detail-val" id="md-area">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-key">Date</span>
              <span class="detail-val" id="md-date">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-key">Time Slot</span>
              <span class="detail-val" id="md-time">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-key">Vehicle</span>
              <span class="detail-val mono" id="md-reg">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-key">Type</span>
              <span class="detail-val">Reserved Section</span>
            </div>
          </div>

          <!-- Change Booking -->
          <div class="card mb-0">
            <div class="card-title">Change Booking</div>
            <div class="form-group">
              <label class="form-label">New Date</label>
              <input type="date" class="form-input" id="ch-date">
            </div>
            <div class="form-group">
              <label class="form-label">New Time Slot</label>
              <select class="form-select" id="ch-time">
                <option>08:00 – 16:00</option>
                <option>09:00 – 17:00</option>
                <option>10:00 – 18:00</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Parking Area</label>
              <select class="form-select" id="ch-area">
                <option>Parking Area A</option>
                <option>Parking Area B</option>
                <option>Parking Area C</option>
              </select>
            </div>
            <button class="btn btn-primary btn-block" id="update-booking-btn">
              Update Booking
            </button>
            <div style="font-size:11px; color:var(--text-3); margin-top:8px;">
              Changes depend on availability.
            </div>
          </div>

        </div>
      </div>
    </div>
    <!-- /content -->

  </div>
</div>

<!-- ── Delete Confirmation Modal ── -->
<div class="modal-overlay" id="del-modal">
  <div class="modal">
    <div class="modal-title">Delete Booking?</div>
    <div class="modal-body" id="del-modal-body">
      Are you sure you want to delete this booking? This cannot be undone.
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('del-modal')">Cancel</button>
      <button class="btn btn-primary" id="confirm-del-btn">Yes, Delete</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/manage-bookings.js"></script>

</body>
</html>
